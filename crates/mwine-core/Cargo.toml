[package]
name = "mwine-core"
version = "0.1.0"
edition = "2021"
description = "MWine 守护进程：组装所有模块，提供 REST API 供 UI 调用"

[dependencies]
mwine-adb = { path = "../mwine-adb" }

mwine-app = { path = "../mwine-app" }
mwine-config = { path = "../mwine-config" }
mwine-display = { path = "../mwine-display" }
mwine-supervisor = { path = "../mwine-supervisor" }
tiny_http = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
libc = "0.2"
mwine-grpc = { path = "../mwine-grpc" }
tokio = { version = "1", features = ["rt"] }
base64 = "0.22"

[[bin]]
name = "mwine-core"
path = "src/main.rs"
