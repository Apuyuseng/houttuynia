[package]
name = "mwine-cli"
description = "mwine command line: doctor / vm / install / apps / mirror / wine"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "mwine"
path = "src/main.rs"

[dependencies]
mwine-adb.workspace = true
mwine-scrcpy.workspace = true
mwine-supervisor.workspace = true
mwine-keymap = { path = "../mwine-keymap" }
mwine-wine.workspace = true
mwine-display = { path = "../mwine-display", features = ["render"] }
mwine-app.workspace = true
anyhow.workspace = true
serde_json = "1"
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
clap.workspace = true
ureq.workspace = true
