// vendored 最小子集：emulator gRPC EmulatorController 的截图/显示器配置部分。
// 服务名、方法名、消息字段号与 AOSP external/qemu
// android/android-grpc/proto/android/emulation/control/emu_controller.proto 对齐，
// 2026-10 经 gRPC 反射从本机 qemu-system-aarch64-headless（emulator 36.5.11）
// 逐字段核对生成。仅收录 mwine-display 用到的 RPC 与消息；未收录字段
// （transport/foldedDisplay 等）保留字段号占位，客户端从不设置，线格式兼容。
syntax = "proto3";

package android.emulation.control;

message Rotation {
  enum SkinRotation {
    PORTRAIT = 0;
    LANDSCAPE = 1;
    REVERSE_PORTRAIT = 2;
    REVERSE_LANDSCAPE = 3;
  }
  SkinRotation rotation = 1;
  double xAxis = 2;
  double yAxis = 3;
  double zAxis = 4;
}

message ImageTransport {
  enum TransportChannel {
    TRANSPORT_CHANNEL_UNSPECIFIED = 0;
    MMAP = 1;
  }
  TransportChannel channel = 1;
  string handle = 2;
}

message FoldedDisplay {
  uint32 width = 1;
  uint32 height = 2;
  uint32 xOffset = 3;
  uint32 yOffset = 4;
}

message ImageFormat {
  enum ImgFormat {
    PNG = 0;
    RGBA8888 = 1;
    RGB888 = 2;
  }
  ImgFormat format = 1;
  Rotation rotation = 2;
  uint32 width = 3;
  uint32 height = 4;
  // 显示器编号：0=主屏，2+=multidisplay。
  uint32 display = 5;
  ImageTransport transport = 6;
  FoldedDisplay foldedDisplay = 7;
  // enum：PHONE=0 FOLDABLE=1 TABLET=2 DESKTOP=3
  uint32 displayMode = 8;
}

message Image {
  ImageFormat format = 1;
  uint32 width = 2 [deprecated = true];
  uint32 height = 3 [deprecated = true];
  bytes image = 4;
  uint32 seq = 5;
  uint64 timestampUs = 6;
}

message DisplayConfiguration {
  uint32 width = 1;
  uint32 height = 2;
  uint32 dpi = 3;
  uint32 flags = 4;
  uint32 display = 5;
}

message DisplayConfigurations {
  repeated DisplayConfiguration displays = 1;
  uint32 userConfigurable = 2;
  uint32 maxDisplays = 3;
}

// google.protobuf.Empty 的本地等价物（空消息线格式相同，避免引入 well-known
// types 的编译路径）。
message Empty {}

service EmulatorController {
  rpc getScreenshot(ImageFormat) returns (Image);
  rpc streamScreenshot(ImageFormat) returns (stream Image);
  rpc getDisplayConfigurations(Empty) returns (DisplayConfigurations);
  rpc setDisplayConfigurations(DisplayConfigurations) returns (DisplayConfigurations);
}
