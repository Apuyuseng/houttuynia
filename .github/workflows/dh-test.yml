name: dh-cred-test
on: [push]
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - name: matrix
        run: |
          V='${{ secrets.DOCKERHUB }}'
          T='${{ secrets.DOCKERHUB_TOKEN }}'
          echo "DOCKERHUB: len=${#V} colon=$(echo "$V" | grep -q ':' && echo yes || echo no)"
          echo "DOCKERHUB_TOKEN: len=${#T}"
          try() { if echo "$2" | docker login -u "$1" --password-stdin >/dev/null 2>&1; then echo "OK   : $3"; else echo "FAIL : $3"; fi; docker logout >/dev/null 2>&1; }
          [ -n "$T" ] && try apuyuseng "$T" "apuyuseng + DOCKERHUB_TOKEN"
          case "$V" in *:*) U="${V%%:*}"; P="${V#*:}"; try "$U" "$P" "split($U) + rest";; *) :;; esac
          try apuyuseng "$V" "apuyuseng + DOCKERHUB(raw)"
