services:
  houttuynia:
    build:
      context: ..
      dockerfile: nas/Dockerfile
      args:
        # 国内网络构建加速（Debian 包镜像）；海外/直连可删除这两行
        APT_MIRROR: mirrors.ustc.edu.cn
    image: houttuynia-nas:latest
    container_name: houttuynia-nas
    restart: unless-stopped
    # 真机发现 / 扫码配对（mDNS 组播）不过 Docker 桥接：要用真机功能必须 host 网络，
    # 此时 ports 映射失效，端口由 MWINE_PORT 直接落在宿主机
    network_mode: host
    environment:
      # 必改：访问令牌（Web 控制台登录凭据；不设置则局域网无防护）
      MWINE_TOKEN: "please-change-me"
      # host 网络下容器端口即宿主机端口。TLS-only 部署：只设 MWINE_TLS_PORT
      # （不绑 HTTP；WebCodecs 投屏需要 https 安全上下文）。本机开发/调试
      # 才用 MWINE_PORT（HTTP）
      MWINE_TLS_PORT: "18443"
      # MWINE_PORT: "7788"
      # 可选：HTTP 代理（镜像/商店拉取走代理）
      # https_proxy: "http://192.168.1.2:7890"
    volumes:
      - houttuynia-data:/data
    # 健康检查起算时间放宽（首次启动要做路径初始化）
    healthcheck:
      start_period: 20s

volumes:
  houttuynia-data:
