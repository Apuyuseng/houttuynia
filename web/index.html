<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鱼腥草 · NAS 控制台</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌿</text></svg>">
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="brand">
      <span class="brand-logo">🌿</span>
      <div>
        <div class="brand-name">鱼腥草</div>
        <div class="brand-sub">NAS 控制台</div>
      </div>
    </div>
    <nav id="nav">
      <a href="#overview" data-page="overview"><span class="ico">📊</span>概览</a>
      <a href="#apps" data-page="apps"><span class="ico">📱</span>应用库</a>
      <a href="#store" data-page="store"><span class="ico">🛍</span>在线商店</a>
      <a href="#images" data-page="images"><span class="ico">💿</span>镜像</a>
      <a href="#terminal" data-page="terminal"><span class="ico">💻</span>终端</a>
      <a href="#settings" data-page="settings"><span class="ico">⚙️</span>设置</a>
    </nav>
    <div class="sidebar-foot">
      <div id="conn-pill" class="conn-pill offline">连接中…</div>
      <div class="ver" id="daemon-ver"></div>
      <button class="link-btn" id="btn-logout">更换访问令牌</button>
    </div>
  </aside>

  <main id="main">
    <header id="topbar">
      <h1 id="page-title">概览</h1>
      <div class="topbar-right">
        <span id="vm-pill" class="vm-pill off">未运行</span>
      </div>
    </header>
    <section id="view"></section>
  </main>
</div>

<!-- 令牌登录浮层 -->
<div id="login-overlay" class="overlay hidden">
  <div class="login-card">
    <div class="login-logo">🌿</div>
    <h2>鱼腥草 NAS 控制台</h2>
    <p class="muted" id="login-tip">请输入访问令牌（服务器 MWINE_TOKEN 环境变量）</p>
    <input type="password" id="login-token" placeholder="访问令牌" autocomplete="current-password">
    <button id="login-btn" class="btn primary block">进入控制台</button>
    <p class="muted small">令牌仅保存在本浏览器 localStorage，不会上传他处。</p>
  </div>
</div>

<div id="toast-wrap"></div>
<script src="stream.js"></script>
<script src="app.js"></script>
</body>
</html>
