[workspace]
resolver = "2"
members = [
    "crates/mwine-adb",
    "crates/mwine-scrcpy",
    "crates/mwine-supervisor",
    "crates/mwine-cli",
    "crates/mwine-grpc",
    "crates/mwine-keymap",
    "crates/mwine-core",
    "crates/mwine-display",
    "crates/mwine-qemu",
    "crates/mwine-wine",
    "crates/mwine-config",
    "crates/mwine-audio",
    "crates/mwine-app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["mwine project"]

[workspace.dependencies]
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
serde = { version = "1", features = ["derive"] }
ureq = { version = "2", features = ["tls"] }
zstd = "0.13"
tar = "0.4"
sha2 = "0.10"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
serde_json = "1"
mwine-adb = { path = "crates/mwine-adb" }
mwine-scrcpy = { path = "crates/mwine-scrcpy" }
mwine-supervisor = { path = "crates/mwine-supervisor" }
mwine-keymap = { path = "crates/mwine-keymap" }
mwine-core = { path = "crates/mwine-core" }
mwine-display = { path = "crates/mwine-display" }
mwine-qemu = { path = "crates/mwine-qemu" }
mwine-wine = { path = "crates/mwine-wine" }
mwine-config = { path = "crates/mwine-config" }
mwine-audio = { path = "crates/mwine-audio" }
mwine-app = { path = "crates/mwine-app" }
mwine-grpc = { path = "crates/mwine-grpc" }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
